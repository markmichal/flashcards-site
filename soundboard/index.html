<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sound Board</title>
    <meta name="description" content="20 sound effects at the click of a button." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#14161f" />
    <style>
      :root {
        --bg: #14161f;
        --panel: #1d2030;
        --text: #f2f3f8;
        --muted: #9aa0b8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        padding: 20px 16px 32px;
        -webkit-tap-highlight-color: transparent;
      }
      main { max-width: 1000px; margin: 0 auto; }
      header {
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
        margin-bottom: 18px;
      }
      h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.02em; flex: 1 1 auto; }
      .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .vol { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      input[type='range'] { width: 140px; accent-color: #ff9f43; }
      .tool {
        background: var(--panel); color: var(--text); border: 1px solid #343a55;
        border-radius: 10px; padding: 9px 14px; font: inherit; cursor: pointer;
      }
      .tool:hover { border-color: #5b6492; }
      .tool:focus-visible, .pad:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      #stop { background: #3a1d28; border-color: #7a3047; }
      #install { background: #1d3a2c; border-color: #2f7a52; }
      #install[hidden] { display: none; }
      .grid {
        display: grid; gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .pad {
        position: relative; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 6px; min-height: 112px; padding: 14px 8px;
        border: 0; border-radius: 16px; color: #fff; font: inherit; cursor: pointer;
        background: linear-gradient(160deg, hsl(var(--h) 70% 52%), hsl(var(--h) 75% 38%));
        box-shadow: 0 4px 0 hsl(var(--h) 70% 26%), 0 8px 16px rgba(0, 0, 0, 0.35);
        transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
        user-select: none; -webkit-user-select: none; touch-action: manipulation;
      }
      .pad:hover { filter: brightness(1.1); }
      .pad.hit, .pad:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 hsl(var(--h) 70% 26%), 0 3px 8px rgba(0, 0, 0, 0.35);
      }
      .pad .emoji { font-size: 2.1rem; line-height: 1; }
      .pad .name { font-weight: 700; font-size: 0.98rem; text-align: center; }
      .pad kbd {
        position: absolute; top: 7px; right: 9px; font: 600 0.72rem ui-monospace, monospace;
        background: rgba(0, 0, 0, 0.3); border-radius: 5px; padding: 1px 6px; text-transform: uppercase;
      }
      .hint { color: var(--muted); font-size: 0.85rem; margin-top: 18px; line-height: 1.5; }
      @media (max-width: 480px) {
        .grid { grid-template-columns: repeat(2, 1fr); }
        .pad kbd { display: none; }
        input[type='range'] { width: 110px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🔊 Sound Board</h1>
        <div class="controls">
          <button id="install" class="tool" hidden>⬇ Install on desktop</button>
          <label class="vol">Volume <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume" /></label>
          <button id="stop" class="tool" title="Stop all sounds (Space or Esc)">⏹ Stop all</button>
        </div>
      </header>
      <div class="grid" id="grid"></div>
      <p class="hint">Tip: use the keys shown on each button. Space or Esc stops everything.</p>
    </main>
    <script src="sounds.js"></script>
    <script src="app.js"></script>
  </body>
</html>
